<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistemas y Organizaciones - Realidad Aumentada
    </title>


    <!-- ========================================= -->
    <!-- A-FRAME -->
    <!-- ========================================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- ========================================= -->
    <!-- MIND-AR -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- ========================================= -->
    <!-- CSS -->
    <!-- ========================================= -->

    <link
        rel="stylesheet"
        href="vista/estilo/estilo.css"
    >

</head>


<body>


    <!-- ========================================= -->
    <!-- MENSAJE DE ESTADO -->
    <!-- ========================================= -->

    <div id="mensaje">
        Preparando realidad aumentada...
    </div>


    <!-- ========================================= -->
    <!-- PANTALLA INICIAL -->
    <!-- ========================================= -->

    <div id="inicio">

        <div id="caja-inicio">

            <h1>
                Realidad Aumentada
            </h1>

            <p>
                Presioná INICIAR y apuntá la cámara hacia la imagen de
                <strong>Sistemas y Organizaciones</strong>.
            </p>

            <button
                id="iniciar"
                type="button"
                onclick="iniciarAR()"
            >
                INICIAR
            </button>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- ESCENA DE REALIDAD AUMENTADA -->
    <!-- ========================================= -->

    <a-scene
        id="escena-ar"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        embedded
    >


        <!-- ========================================= -->
        <!-- CÁMARA -->
        <!-- ========================================= -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >
        </a-camera>


        <!-- ========================================= -->
        <!-- ILUMINACIÓN -->
        <!-- ========================================= -->

        <a-light
            type="ambient"
            intensity="1.5"
        >
        </a-light>

        <a-light
            type="directional"
            intensity="2"
            position="1 2 2"
        >
        </a-light>


        <!-- ========================================= -->
        <!-- IMAGEN OBJETIVO -->
        <!-- ========================================= -->

        <a-entity
            id="objetivo"
            mindar-image-target="targetIndex: 0"
        >


            <!-- ================================= -->
            <!-- SISTEMA CENTRAL -->
            <!-- ================================= -->

            <a-box
                width="0.45"
                height="0.28"
                depth="0.18"
                color="#2563eb"

                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 9000;
                    easing: linear;
                "
            >
            </a-box>


            <a-text
                value="SISTEMA"
                align="center"
                color="#ffffff"
                width="1.4"
                position="0 0 0.12"
            >
            </a-text>


            <!-- ================================= -->
            <!-- RRHH -->
            <!-- ================================= -->

            <a-sphere
                position="0 0.15 0"
                radius="0.07"
                color="#f4c2a1"
            >
            </a-sphere>


            <a-cylinder
                position="0 0 0"
                radius="0.09"
                height="0.18"
                color="#3b82f6"
            >
            </a-cylinder>


            <a-cylinder
                position="0 -0.13 0"
                radius="0.14"
                height="0.04"
                color="#1e3a8a"
            >
            </a-cylinder>


            <a-text
                value="RRHH"
                align="center"
                color="#ffffff"
                width="1.1"
                position="0 -0.25 0"
            >
            </a-text>


            <!-- ================================= -->
            <!-- ADMINISTRACIÓN -->
            <!-- ================================= -->

            <a-box
                position="0 0.05 0"
                width="0.28"
                height="0.40"
                depth="0.20"
                color="#64748b"
            >
            </a-box>


            <a-cone
                position="0 0.30 0"
                radius-bottom="0.24"
                radius-top="0"
                height="0.16"
                color="#334155"
            >
            </a-cone>


            <a-box
                position="-0.07 0.10 0.105"
                width="0.05"
                height="0.07"
                depth="0.01"
                color="#38bdf8"
            >
            </a-box>


            <a-box
                position="0.07 0.10 0.105"
                width="0.05"
                height="0.07"
                depth="0.01"
                color="#38bdf8"
            >
            </a-box>


            <a-text
                value="ADMINISTRACION"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.22 0"
            >
            </a-text>


            <!-- ================================= -->
            <!-- BASE DE DATOS -->
            <!-- ================================= -->

            <a-cylinder
                position="0 0.14 0"
                radius="0.16"
                height="0.08"
                color="#8b5cf6"
            >
            </a-cylinder>


            <a-cylinder
                position="0 0.05 0"
                radius="0.16"
                height="0.08"
                color="#7c3aed"
            >
            </a-cylinder>


            <a-cylinder
                position="0 -0.04 0"
                radius="0.16"
                height="0.08"
                color="#6d28d9"
            >
            </a-cylinder>


            <a-text
                value="BASE DE DATOS"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.20 0"
            >
            </a-text>


            <!-- ================================= -->
            <!-- EXISTENCIAS -->
            <!-- ================================= -->

            <a-box
                position="-0.09 0.05 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#f59e0b"
            >
            </a-box>


            <a-box
                position="0.09 0.05 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#d97706"
            >
            </a-box>


            <a-box
                position="0 0.21 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#b45309"
            >
            </a-box>


            <a-text
                value="EXISTENCIAS"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.20 0"
            >
            </a-text>


        </a-entity>

    </a-scene>


    <!-- ========================================= -->
    <!-- CONTROL DE REALIDAD AUMENTADA -->
    <!-- ========================================= -->

    <script>

        /*
         * ========================================
         * VARIABLES
         * ========================================
         */

        let escenaAR = null;
        let sistemaAR = null;


        /*
         * ========================================
         * CUANDO CARGA LA PÁGINA
         * ========================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                console.log(
                    "AR: página cargada"
                );


                escenaAR =
                    document.getElementById(
                        "escena-ar"
                    );


                /*
                 * Esperamos a que A-Frame
                 * termine de cargar
                 */

                escenaAR.addEventListener(
                    "loaded",
                    function () {

                        console.log(
                            "AR: escena A-Frame cargada"
                        );


                        sistemaAR =
                            escenaAR.systems[
                                "mindar-image-system"
                            ];


                        console.log(
                            "AR: MindAR:",
                            sistemaAR
                        );

                    }
                );


                /*
                 * =================================
                 * MINDAR LISTO
                 * =================================
                 */

                escenaAR.addEventListener(
                    "arReady",
                    function () {

                        console.log(
                            "AR: CÁMARA INICIADA"
                        );


                        document.getElementById(
                            "inicio"
                        ).style.display = "none";


                        const mensaje =
                            document.getElementById(
                                "mensaje"
                            );


                        mensaje.style.display =
                            "block";


                        mensaje.innerText =
                            "✓ Cámara activa · Buscando la imagen...";

                    }
                );


                /*
                 * =================================
                 * ERROR
                 * =================================
                 */

                escenaAR.addEventListener(
                    "arError",
                    function (evento) {

                        console.error(
                            "AR: ERROR",
                            evento
                        );


                        document.getElementById(
                            "mensaje"
                        ).innerText =
                            "❌ No se pudo iniciar la cámara.";

                    }
                );


                /*
                 * =================================
                 * IMAGEN ENCONTRADA
                 * =================================
                 */

                const objetivo =
                    document.getElementById(
                        "objetivo"
                    );


                objetivo.addEventListener(
                    "targetFound",
                    function () {

                        console.log(
                            "AR: IMAGEN RECONOCIDA"
                        );


                        document.getElementById(
                            "mensaje"
                        ).innerText =
                            "🎉 ¡IMAGEN RECONOCIDA!";

                    }
                );


                /*
                 * =================================
                 * IMAGEN PERDIDA
                 * =================================
                 */

                objetivo.addEventListener(
                    "targetLost",
                    function () {

                        console.log(
                            "AR: IMAGEN PERDIDA"
                        );


                        document.getElementById(
                            "mensaje"
                        ).innerText =
                            "Buscando la imagen...";

                    }
                );

            }
        );


        /*
         * ========================================
         * BOTÓN INICIAR
         * ========================================
         *
         * Esta función está directamente
         * conectada al botón mediante:
         *
         * onclick="iniciarAR()"
         *
         * Así no dependemos de otro archivo JS.
         *
         */

        function iniciarAR() {

            console.log(
                "AR: BOTÓN INICIAR PRESIONADO"
            );


            const mensaje =
                document.getElementById(
                    "mensaje"
                );


            mensaje.style.display =
                "block";


            mensaje.innerText =
                "Iniciando cámara...";


            /*
             * Intentamos obtener MindAR
             * directamente de la escena.
             */

            const escena =
                document.getElementById(
                    "escena-ar"
                );


            if (!escena) {

                mensaje.innerText =
                    "❌ No se encontró la escena AR.";

                return;

            }


            sistemaAR =
                escena.systems[
                    "mindar-image-system"
                ];


            /*
             * Si todavía no cargó,
             * esperamos un momento.
             */

            if (!sistemaAR) {

                console.log(
                    "AR: esperando MindAR..."
                );


                mensaje.innerText =
                    "Cargando realidad aumentada...";


                let intentos = 0;


                const esperarMindAR =
                    setInterval(
                        function () {

                            intentos++;


                            sistemaAR =
                                escena.systems[
                                    "mindar-image-system"
                                ];


                            if (sistemaAR) {

                                clearInterval(
                                    esperarMindAR
                                );


                                console.log(
                                    "AR: MindAR encontrado"
                                );


                                mensaje.innerText =
                                    "Iniciando cámara...";


                                iniciarSistemaAR();

                            }


                            /*
                             * Después de 10 segundos
                             * dejamos de esperar.
                             */

                            if (intentos >= 20) {

                                clearInterval(
                                    esperarMindAR
                                );


                                mensaje.innerText =
                                    "❌ No se pudo cargar MindAR.";

                            }

                        },
                        500
                    );


                return;

            }


            iniciarSistemaAR();

        }


        /*
         * ========================================
         * INICIAR MINDAR
         * ========================================
         */

        function iniciarSistemaAR() {

            try {

                console.log(
                    "AR: ejecutando start()"
                );


                const resultado =
                    sistemaAR.start();


                /*
                 * Algunas versiones devuelven
                 * una Promise.
                 */

                if (
                    resultado &&
                    typeof resultado.catch === "function"
                ) {

                    resultado.catch(
                        function (error) {

                            console.error(
                                "AR: error al iniciar",
                                error
                            );


                            document.getElementById(
                                "mensaje"
                            ).innerText =
                                "❌ No se pudo iniciar la cámara.";

                        }
                    );

                }

            }
            catch (error) {

                console.error(
                    "AR: excepción",
                    error
                );


                document.getElementById(
                    "mensaje"
                ).innerText =
                    "❌ Error al iniciar la cámara.";

            }

        }

    </script>


</body>

</html>
