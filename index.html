<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Realidad Aumentada N3</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MIND-AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }

        #mensaje {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 15px 20px;
            border-radius: 12px;

            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="mensaje">
        Preparando realidad aumentada...
    </div>

    <a-scene
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
        "
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            mindar-image-target="targetIndex: 0">

            <a-plane
                position="0 0 0.01"
                width="1"
                height="0.55"
                color="#111827"
                opacity="0.90">
            </a-plane>

            <a-text
                value="¡IMAGEN RECONOCIDA!"
                align="center"
                color="#ffffff"
                width="1.5"
                position="0 0.10 0.02">
            </a-text>

            <a-text
                value="Realidad Aumentada N3"
                align="center"
                color="#ffffff"
                width="1.2"
                position="0 -0.08 0.02">
            </a-text>

        </a-entity>

    </a-scene>

    <script>
        const escena = document.querySelector("a-scene");
        const mensaje = document.getElementById("mensaje");

        escena.addEventListener("arReady", function () {
            mensaje.innerText =
                "✓ Cámara activa. Apuntá hacia la imagen.";
        });

        escena.addEventListener("arError", function () {
            mensaje.innerText =
                "❌ No se pudo iniciar la cámara.";
        });

        escena.addEventListener("targetFound", function () {
            mensaje.innerText =
                "🎉 ¡IMAGEN RECONOCIDA!";
        });

        escena.addEventListener("targetLost", function () {
            mensaje.innerText =
                "Buscando la imagen...";
        });
    </script>

</body>

</html>
