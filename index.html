<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas y Organizaciones - Realidad Aumentada</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MIND-AR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="vista/estilo/estilo.css">
</head>

<body>

    <!-- MENSAJE -->
    <div id="mensaje">Preparando realidad aumentada...</div>

    <!-- PANTALLA INICIAL -->
    <div id="inicio">
        <div id="caja-inicio">
            <h1>Realidad Aumentada</h1>

            <p>
                Presioná INICIAR y apuntá la cámara hacia la imagen de
                <strong>Sistemas y Organizaciones</strong>.
            </p>

            <button id="iniciar">INICIAR</button>
        </div>
    </div>


    <!-- ESCENA AR -->
    <a-scene
        id="escena-ar"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
    >

        <!-- CÁMARA -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- ILUMINACIÓN -->
        <a-light
            type="ambient"
            intensity="1.5">
        </a-light>

        <a-light
            type="directional"
            intensity="2"
            position="1 2 2">
        </a-light>


        <!-- ================================= -->
        <!-- IMAGEN OBJETIVO -->
        <!-- ================================= -->

        <a-entity
            id="objetivo"
            mindar-image-target="targetIndex: 0">


            <!-- SISTEMA CENTRAL -->
            <a-box
                width="0.45"
                height="0.28"
                depth="0.18"
                color="#2563eb"
                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 9000;
                    easing: linear;
                ">
            </a-box>

            <a-text
                value="SISTEMA"
                align="center"
                color="#ffffff"
                width="1.4"
                position="0 0 0.12">
            </a-text>


            <!-- RRHH -->
            <a-sphere
                position="0 0.15 0"
                radius="0.07"
                color="#f4c2a1">
            </a-sphere>

            <a-cylinder
                position="0 0 0"
                radius="0.09"
                height="0.18"
                color="#3b82f6">
            </a-cylinder>

            <a-cylinder
                position="0 -0.13 0"
                radius="0.14"
                height="0.04"
                color="#1e3a8a">
            </a-cylinder>

            <a-text
                value="RRHH"
                align="center"
                color="#ffffff"
                width="1.1"
                position="0 -0.25 0">
            </a-text>


            <!-- ADMINISTRACIÓN -->
            <a-box
                position="0 0.05 0"
                width="0.28"
                height="0.40"
                depth="0.20"
                color="#64748b">
            </a-box>

            <a-cone
                position="0 0.30 0"
                radius-bottom="0.24"
                radius-top="0"
                height="0.16"
                color="#334155">
            </a-cone>

            <a-box
                position="-0.07 0.10 0.105"
                width="0.05"
                height="0.07"
                depth="0.01"
                color="#38bdf8">
            </a-box>

            <a-box
                position="0.07 0.10 0.105"
                width="0.05"
                height="0.07"
                depth="0.01"
                color="#38bdf8">
            </a-box>

            <a-text
                value="ADMINISTRACION"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.22 0">
            </a-text>


            <!-- BASE DE DATOS -->
            <a-cylinder
                position="0 0.14 0"
                radius="0.16"
                height="0.08"
                color="#8b5cf6">
            </a-cylinder>

            <a-cylinder
                position="0 0.05 0"
                radius="0.16"
                height="0.08"
                color="#7c3aed">
            </a-cylinder>

            <a-cylinder
                position="0 -0.04 0"
                radius="0.16"
                height="0.08"
                color="#6d28d9">
            </a-cylinder>

            <a-text
                value="BASE DE DATOS"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.20 0">
            </a-text>


            <!-- EXISTENCIAS -->
            <a-box
                position="-0.09 0.05 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#f59e0b">
            </a-box>

            <a-box
                position="0.09 0.05 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#d97706">
            </a-box>

            <a-box
                position="0 0.21 0"
                width="0.16"
                height="0.16"
                depth="0.16"
                color="#b45309">
            </a-box>

            <a-text
                value="EXISTENCIAS"
                align="center"
                color="#ffffff"
                width="1"
                position="0 -0.20 0">
            </a-text>


        </a-entity>

    </a-scene>


    <!-- ================================= -->
    <!-- CONTROL DE LA REALIDAD AUMENTADA -->
    <!-- ================================= -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const botonIniciar =
                document.getElementById("iniciar");

            const pantallaInicio =
                document.getElementById("inicio");

            const mensajeEstado =
                document.getElementById("mensaje");

            const escena =
                document.getElementById("escena-ar");

            const objetivo =
                document.getElementById("objetivo");


            /* ============================== */
            /* BOTÓN INICIAR */
            /* ============================== */

            botonIniciar.addEventListener("click", function () {

                mensajeEstado.style.display = "block";

                mensajeEstado.textContent =
                    "Iniciando cámara...";

                const sistemaAR =
                    escena.systems["mindar-image-system"];

                if (!sistemaAR) {

                    mensajeEstado.textContent =
                        "Esperando que cargue la realidad aumentada...";

                    return;
                }

                sistemaAR.start();

            });


            /* ============================== */
            /* MINDAR LISTO */
            /* ============================== */

            escena.addEventListener("arReady", function () {

                pantallaInicio.style.display = "none";

                mensajeEstado.style.display = "block";

                mensajeEstado.textContent =
                    "✓ Cámara activa · Buscando la imagen...";

            });


            /* ============================== */
            /* ERROR */
            /* ============================== */

            escena.addEventListener("arError", function () {

                mensajeEstado.style.display = "block";

                mensajeEstado.textContent =
                    "❌ No se pudo iniciar la cámara.";

            });


            /* ============================== */
            /* IMAGEN ENCONTRADA */
            /* ============================== */

            objetivo.addEventListener("targetFound", function () {

                mensajeEstado.textContent =
                    "🎉 ¡IMAGEN RECONOCIDA!";

            });


            /* ============================== */
            /* IMAGEN PERDIDA */
            /* ============================== */

            objetivo.addEventListener("targetLost", function () {

                mensajeEstado.textContent =
                    "Buscando la imagen...";

            });

        });

    </script>

</body>

</html>
